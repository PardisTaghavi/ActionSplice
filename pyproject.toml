[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionsplice"
version = "0.1.0"
description = "ActionSplice: same-step state editing for interruptible world models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
]

[project.optional-dependencies]
train = [
    "lpips>=0.1.4",
    "wandb>=0.17",
]
demo = [
    "gradio>=5",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
actionsplice-train = "cst.training.train:main"
actionsplice-capture-hyworld15 = "cst.cli.capture_hyworld15_paper:main"
actionsplice-capture-hyworld15-bootstrap = "cst.cli.capture_hyworld15:main"
actionsplice-capture-minwm = "cst.cli.capture_minwm:main"
actionsplice-export-hyworld15-manifests = "cst.cli.export_hyworld15_manifests:main"
actionsplice-baselines-hyworld15 = "cst.cli.baselines_hyworld15:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
