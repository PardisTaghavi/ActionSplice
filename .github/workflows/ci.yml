name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.24" "pytest>=8" "ruff>=0.9"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
